<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ReadyRentalsOnline — Service Portal</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <nav>
    <span class="brand">ReadyRentalsOnline</span>
    <a href="manager.html">Manager</a>
    <a class="active" href="worker.html">Worker</a>
  </nav>
  <main>
    <h1>Worker / tenant flow</h1>
    <p class="muted">Token from query string <code>?token=</code>. Page re-fetches GET /wo/{token} after every action.
    </p>
    <div id="error" class="banner hidden"></div>

    <section class="card narrow">
      <label>worker_access_token</label>
      <div class="link-box">
        <input type="text" id="token" class="mono" placeholder="paste token" />
        <button type="button" class="primary" id="load">Load GET /wo/{token}</button>
      </div>
    </section>

    <section id="stage" class="narrow"></section>

    <details class="debug" open>
      <summary>Last response</summary>
      <pre id="debug">(no requests yet)</pre>
    </details>
  </main>
  <script src="api.js"></script>
  <script>
    const { api, apiUpload } = window.WOApi;
    const $ = (id) => document.getElementById(id);
    const errorEl = $("error");
    let wo = null;

    function token() {
      return $("token").value.trim();
    }
    function showError(err) {
      errorEl.classList.remove("hidden");
      errorEl.textContent = err && err.raw ? err.raw : String(err && err.message ? err.message : err);
    }
    function clearError() {
      errorEl.classList.add("hidden");
      errorEl.textContent = "";
    }
    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])
      );
    }
    function badge(status) {
      return `<span class="badge ${status}">${status}</span>`;
    }

    window.addEventListener("api:last", (ev) => {
      const d = ev.detail;
      $("debug").textContent =
        `${d.method} ${d.url}\nHTTP ${d.status}\n\n` +
        (typeof d.body === "string" ? d.body : JSON.stringify(d.body, null, 2));
    });

    async function refresh() {
      wo = await api("GET", `/wo/${encodeURIComponent(token())}`, { auth: false });
      render();
    }

    async function run(fn) {
      try {
        clearError();
        await fn();
        await refresh();
      } catch (e) {
        showError(e);
        try {
          await refresh();
        } catch (_) {
          /* keep original error */
        }
      }
    }

    function headerHtml() {
      const p = wo.priority;
      return `
        <div class="card">
          <div>${badge(wo.status)} <strong class="mono">${esc(wo.work_order_number)}</strong></div>
          <dl class="fields">
            <dt>address</dt><dd>${esc(wo.service_address)}</dd>
            <dt>tenant</dt><dd>${esc(wo.tenant_names)}</dd>
            <dt>assigned to</dt><dd>${esc(wo.assigned_to_name)}</dd>
            <dt>priority</dt><dd class="mono">${p ? esc(p.code + " / " + p.hour_target + "h") : "—"}</dd>
            <dt>date_assigned</dt><dd class="mono">${esc(wo.date_assigned)}</dd>
            <dt>start_time</dt><dd class="mono">${esc(wo.start_time)}</dd>
            <dt>end_time</dt><dd class="mono">${esc(wo.end_time)}</dd>
            <dt>duration_minutes</dt><dd class="mono">${esc(wo.duration_minutes)}</dd>
            <dt>within_target</dt><dd>${wo.within_target === true ? badge("true") : wo.within_target === false ? badge("false") : "—"}</dd>
          </dl>
        </div>`;
    }

    function thumb(url, label) {
      if (!url) return `<div class="muted">${label}: none</div>`;
      return `<div>${label}<br><img src="${esc(url)}" alt="${esc(label)}"></div>`;
    }

    function bindSigPad(canvas) {
      const ctx = canvas.getContext("2d");
      const rect = () => canvas.getBoundingClientRect();
      function resize() {
        const r = rect();
        const dpr = window.devicePixelRatio || 1;
        canvas.width = Math.floor(r.width * dpr);
        canvas.height = Math.floor(r.height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.strokeStyle = "#111";
        ctx.lineWidth = 2;
        ctx.lineCap = "round";
      }
      resize();
      let drawing = false;
      function pos(ev) {
        const r = rect();
        const p = ev.touches ? ev.touches[0] : ev;
        return { x: p.clientX - r.left, y: p.clientY - r.top };
      }
      canvas.addEventListener("pointerdown", (ev) => {
        drawing = true;
        canvas.setPointerCapture(ev.pointerId);
        const p = pos(ev);
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
      });
      canvas.addEventListener("pointermove", (ev) => {
        if (!drawing) return;
        const p = pos(ev);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
      });
      const stop = () => { drawing = false; };
      canvas.addEventListener("pointerup", stop);
      canvas.addEventListener("pointercancel", stop);
      return { clear: () => { resize(); } };
    }

    function renderAssigned() {
      $("stage").innerHTML =
        headerHtml() +
        itemsReadOnly() +
        `<div class="card"><button class="primary" type="button" id="start">Start job · POST /wo/{token}/start</button></div>`;
      $("start").onclick = () => run(() => api("POST", `/wo/${encodeURIComponent(token())}/start`, { auth: false }));
    }

    function itemsReadOnly() {
      return `<div class="card"><h2>Items</h2>${(wo.items || [])
        .map(
          (it) => `
        <div class="item-row">
          <strong>#${it.id} ${esc(it.category)}</strong>
          <div>${esc(it.details)}</div>
          <div>resolved: ${it.resolved}</div>
          <div class="thumbs">${thumb(it.before_photo_url, "before")}${thumb(it.after_photo_url, "after")}</div>
        </div>`
        )
        .join("")}</div>`;
    }

    function renderInProgress() {
      const items = (wo.items || [])
        .map(
          (it) => `
        <div class="item-row" data-item="${it.id}">
          <strong>item ${it.id} · ${esc(it.category)}</strong>
          <label>details</label>
          <textarea class="details">${esc(it.details || "")}</textarea>
          <label><input type="checkbox" class="resolved" ${it.resolved ? "checked" : ""} /> resolved</label>
          <div class="row">
            <div>
              <label>before photo</label>
              <input type="file" accept="image/*" class="photo" data-slot="before" />
              <div class="thumbs preview-before">${thumb(it.before_photo_url, "before")}</div>
            </div>
            <div>
              <label>after photo</label>
              <input type="file" accept="image/*" class="photo" data-slot="after" />
              <div class="thumbs preview-after">${thumb(it.after_photo_url, "after")}</div>
            </div>
          </div>
        </div>`
        )
        .join("");
      $("stage").innerHTML = `
        ${headerHtml()}
        <div class="card">
          <h2>Work items · PATCH + photo upload</h2>
          ${items}
        </div>
        <form class="card" id="complete-form">
          <h2>Complete · POST /wo/{token}/complete</h2>
          <label><input type="checkbox" id="inspected" ${wo.entire_unit_inspected ? "checked" : ""} /> entire_unit_inspected</label>
          <label>inspection_results</label>
          <textarea id="inspection_results">${esc(wo.inspection_results || "")}</textarea>
          <label>if_incomplete_explanation</label>
          <textarea id="if_incomplete_explanation">${esc(wo.if_incomplete_explanation || "")}</textarea>
          <button class="primary" type="submit">Mark complete</button>
        </form>`;

      $("stage").querySelectorAll("[data-item]").forEach((row) => {
        const id = row.getAttribute("data-item");
        const path = `/wo/${encodeURIComponent(token())}/items/${id}`;
        const patch = () =>
          run(() =>
            api("PATCH", path, {
              auth: false,
              json: {
                details: row.querySelector(".details").value,
                resolved: row.querySelector(".resolved").checked,
              },
            })
          );
        row.querySelector(".details").addEventListener("change", patch);
        row.querySelector(".resolved").addEventListener("change", patch);
        row.querySelectorAll(".photo").forEach((input) => {
          input.addEventListener("change", () => {
            const file = input.files && input.files[0];
            if (!file) return;
            const slot = input.getAttribute("data-slot");
            run(() =>
              apiUpload(`${path}/photo?slot=${slot}`, file).then((item) => {
                const box = row.querySelector(slot === "before" ? ".preview-before" : ".preview-after");
                box.innerHTML = thumb(item[`${slot}_photo_url`], slot);
              })
            );
          });
        });
      });

      $("complete-form").onsubmit = (e) => {
        e.preventDefault();
        const payload = {
          entire_unit_inspected: $("inspected").checked,
          inspection_results: $("inspection_results").value || null,
          if_incomplete_explanation: $("if_incomplete_explanation").value || null,
        };
        run(() =>
          api("POST", `/wo/${encodeURIComponent(token())}/complete`, { auth: false, json: payload })
        );
      };
    }

    function renderSignoff() {
      const tenantDone = !!wo.tenant_signed;
      const techDone = !!wo.tech_signed;
      $("stage").innerHTML = `
        ${headerHtml()}
        ${itemsReadOnly()}
        <div class="card">
          <p class="muted">${esc(wo.tenant_disclaimer)}</p>
          <p>incomplete: ${esc(wo.if_incomplete_explanation)}</p>
          <p>entire_unit_inspected: ${esc(wo.entire_unit_inspected)} · ${esc(wo.inspection_results)}</p>
        </div>
        <div class="card" id="tenant-block">
          <h2>1. Tenant signature · POST /wo/{token}/sign</h2>
          ${tenantDone
          ? `<p>Signed as <strong>${esc(wo.tenant_signature_name)}</strong> at <code>${esc(wo.tenant_signature_at)}</code></p>
               ${wo.tenant_signature_url ? `<img class="sig-preview" src="${esc(wo.tenant_signature_url)}" alt="tenant">` : ""}`
          : `<label>Typed name</label>
               <input type="text" id="tenant-name" value="${esc(wo.tenant_names || "")}" />
               <canvas class="sig" id="tenant-canvas"></canvas>
               <button type="button" id="tenant-clear">Clear pad</button>
               <button class="primary" type="button" id="tenant-sign">Confirm tenant signature</button>`}
        </div>
        <div class="card" id="tech-block">
          <h2>2. Technician signature</h2>
          ${techDone
          ? `<p>Signed as <strong>${esc(wo.tech_signature_name)}</strong> at <code>${esc(wo.tech_signature_at)}</code></p>
               ${wo.tech_signature_url ? `<img class="sig-preview" src="${esc(wo.tech_signature_url)}" alt="tech">` : ""}`
          : `<label>Typed name</label>
               <input type="text" id="tech-name" value="${esc(wo.assigned_to_name || "")}" ${tenantDone ? "" : "disabled"} />
               <canvas class="sig" id="tech-canvas"></canvas>
               <button type="button" id="tech-clear" ${tenantDone ? "" : "disabled"}>Clear pad</button>
               <button class="primary" type="button" id="tech-sign" ${tenantDone ? "" : "disabled"}>Confirm tech signature</button>
               ${tenantDone ? "" : "<p class='muted'>Tech pad disabled until tenant signature succeeds.</p>"}`}
        </div>`;

      if (!tenantDone) {
        const pad = bindSigPad($("tenant-canvas"));
        $("tenant-clear").onclick = pad.clear;
        $("tenant-sign").onclick = () => {
          const png = $("tenant-canvas").toDataURL("image/png");
          run(() =>
            api("POST", `/wo/${encodeURIComponent(token())}/sign`, {
              auth: false,
              json: { signer: "tenant", name: $("tenant-name").value, signature_png_base64: png },
            })
          );
        };
      }
      if (tenantDone && !techDone) {
        const pad = bindSigPad($("tech-canvas"));
        $("tech-clear").onclick = pad.clear;
        $("tech-sign").onclick = () => {
          const png = $("tech-canvas").toDataURL("image/png");
          run(() =>
            api("POST", `/wo/${encodeURIComponent(token())}/sign`, {
              auth: false,
              json: { signer: "tech", name: $("tech-name").value, signature_png_base64: png },
            })
          );
        };
      }
    }

    function renderSignedOff() {
      $("stage").innerHTML = `
        ${headerHtml()}
        ${itemsReadOnly()}
        <div class="card">
          <h2>Signatures</h2>
          <p>Tenant: ${esc(wo.tenant_signature_name)} · <code>${esc(wo.tenant_signature_at)}</code></p>
          ${wo.tenant_signature_url ? `<img class="sig-preview" src="${esc(wo.tenant_signature_url)}" alt="tenant">` : ""}
          <p>Tech: ${esc(wo.tech_signature_name)} · <code>${esc(wo.tech_signature_at)}</code></p>
          ${wo.tech_signature_url ? `<img class="sig-preview" src="${esc(wo.tech_signature_url)}" alt="tech">` : ""}
          <p><a class="btn primary" href="/wo/${encodeURIComponent(token())}/pdf" target="_blank">GET /wo/{token}/pdf</a></p>
        </div>`;
    }

    function render() {
      const s = wo && wo.status;
      if (!s) {
        $("stage").innerHTML = "";
        return;
      }
      if (s === "assigned") return renderAssigned();
      if (s === "in_progress") return renderInProgress();
      if (s === "completed_pending_signoff" || s === "incomplete_needs_return") return renderSignoff();
      if (s === "signed_off") return renderSignedOff();
      $("stage").innerHTML = headerHtml() + `<pre class="mono">${esc(JSON.stringify(wo, null, 2))}</pre>`;
    }

    $("load").onclick = () => {
      const t = token();
      if (!t) {
        showError({ raw: "Paste a worker_access_token first." });
        return;
      }
      const url = new URL(location.href);
      url.searchParams.set("token", t);
      history.replaceState(null, "", url);
      run(async () => { });
    };

    const q = new URLSearchParams(location.search).get("token");
    if (q) {
      $("token").value = q;
      run(async () => { });
    }
  </script>
</body>

</html>
