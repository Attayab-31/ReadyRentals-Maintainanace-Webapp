<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" width="520" height="400" role="img" aria-labelledby="title desc">
  <title id="title">Ready Rentals Online logo — light mode</title>
  <desc id="desc">Geometric house roof and chimney above a four-pane window, a curved metallic swoosh, a thin divider line, and the words READY RENTALS / ONLINE.COM.</desc>
  <defs>
    <linearGradient id="houseBlue" x1="10%" y1="90%" x2="90%" y2="10%">
      <stop offset="0%" stop-color="#24384f"/>
      <stop offset="14%" stop-color="#344e68"/>
      <stop offset="31%" stop-color="#59738b"/>
      <stop offset="45%" stop-color="#425e77"/>
      <stop offset="58%" stop-color="#273d55"/>
      <stop offset="71%" stop-color="#607a92"/>
      <stop offset="83%" stop-color="#71889d"/>
      <stop offset="93%" stop-color="#3d566e"/>
      <stop offset="100%" stop-color="#1d3045"/>
    </linearGradient>
    <linearGradient id="blueText" x1="5%" y1="0%" x2="95%" y2="100%">
      <stop offset="0%" stop-color="#5b7188"/>
      <stop offset="14%" stop-color="#30465f"/>
