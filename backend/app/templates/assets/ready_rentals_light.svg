      <stop offset="39%" stop-color="#8f999f"/>
      <stop offset="53%" stop-color="#5e6872"/>
      <stop offset="67%" stop-color="#929da6"/>
      <stop offset="80%" stop-color="#c5cbd0"/>
      <stop offset="90%" stop-color="#9aa4ac"/>
      <stop offset="100%" stop-color="#687580"/>
    </linearGradient>
    <linearGradient id="silverTextDark" x1="10%" y1="0%" x2="90%" y2="100%">
