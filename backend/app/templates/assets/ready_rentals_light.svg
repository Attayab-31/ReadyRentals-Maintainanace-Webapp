    <path d="M159 103 L257 20 L364 108" fill="none" stroke="#e0e7ec" stroke-opacity=".23" stroke-width="1.8" stroke-linecap="square"/>
    <!-- inner roof / wall shadow edge -->
    <path d="M176 111 L257 42 L342 108" fill="none" stroke="#071225" stroke-opacity=".72" stroke-width="3.6" stroke-linejoin="miter"/>
  </g>

  <!-- Four-pane window -->
  <g>
    <rect x="237" y="101" width="18" height="18" rx="1.1" fill="url(#silverBlueLight)" stroke="#263e59" stroke-width="1"/>
    <rect x="259" y="101" width="18" height="18" rx="1.1" fill="url(#silverBlueLight)" stroke="#263e59" stroke-width="1"/>
    <rect x="237" y="123" width="18" height="18" rx="1.1" fill="url(#silverBlueLight)" stroke="#263e59" stroke-width="1"/>
    <rect x="259" y="123" width="18" height="18" rx="1.1" fill="url(#silverBlueLight)" stroke="#263e59" stroke-width="1"/>
    <path d="M239 103 H253 M261 103 H275 M239 125 H253 M261 125 H275" stroke="#e8eef3" stroke-opacity=".30" stroke-width=".9"/>
  </g>

  <!-- Metallic curved swoosh -->
  <path d="M134 223
           C213 179 295 148 388 136
           C300 164 224 200 183 232
           L134 230
           Z"
        fill="url(#swoosh)"
        stroke="#4b6277" stroke-opacity=".8" stroke-width="1.1"
        stroke-linejoin="round"/>
  <path d="M139 223 C215 182 295 151 381 139" fill="none" stroke="#f2f3f4" stroke-opacity=".46" stroke-width="1.5"/>
  <path d="M138 229 L182 231 C231 197 294 168 360 147" fill="none" stroke="#24384e" stroke-opacity=".28" stroke-width="1.3"/>

  <!-- Divider line -->
  <g>
    <rect x="15" y="251" width="486" height="5" rx="1.5" fill="url(#lineGrad)"/>
    <rect x="17" y="252" width="482" height="1.1" fill="#e6ebef" fill-opacity=".22"/>
  </g>

