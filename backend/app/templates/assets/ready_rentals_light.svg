  <!-- Transparent background: intended for light UI surfaces. -->
  <!-- House body: traced from source geometry (left post, roof, right eave). -->
  <g>
    <rect x="307" y="34" width="27" height="66" rx="1.5" fill="url(#houseBlue)"/>
    <path d="M153 203 L153 104 L257 15 L371 109 L342 108 L257 42 L176 111 L176 190 Z"
          fill="url(#houseBlue)" stroke="#0b1b34" stroke-width="1.1" stroke-linejoin="miter"/>
